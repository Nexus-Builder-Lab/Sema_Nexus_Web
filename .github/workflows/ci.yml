name: CI Web

on:
  push:
    branches: [main, "feature/GH-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  branch-name:
    name: Nome do branch
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    steps:
      - name: Validar padrão feature/GH-<n>
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [[ "$BRANCH" =~ ^feature/GH-[0-9]+$ ]]; then
            echo "Branch válido: $BRANCH"
          else
            echo "::error::Branch '$BRANCH' fora do padrão ^feature/GH-[0-9]+\$ (ver CLAUDE.md)."
            exit 1
          fi

  lint-test-build:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detectar projeto Node
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "has_pkg=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_pkg=false" >> "$GITHUB_OUTPUT"
            echo "::warning::package.json ainda não existe (Issue #1). Lint, testes e build ignorados."
            echo "### ⚠️ Build ignorado: package.json ainda não existe (Issue #1)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configurar Node 22
        if: steps.detect.outputs.has_pkg == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependências
        if: steps.detect.outputs.has_pkg == 'true'
        run: npm ci

      - name: Lint
        if: steps.detect.outputs.has_pkg == 'true'
        run: npm run lint

      - name: Testes
        if: steps.detect.outputs.has_pkg == 'true'
        run: npm test
        env:
          CI: "true"

      - name: Build de produção
        if: steps.detect.outputs.has_pkg == 'true'
        run: npm run build

      - name: Publicar build como artefato
        if: steps.detect.outputs.has_pkg == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/
          retention-days: 7

  docker-build:
    name: Build da imagem Docker (sem publicar)
    runs-on: ubuntu-latest
    needs: lint-test-build
    steps:
      - uses: actions/checkout@v4
      - name: Detectar Dockerfile
        id: detect
        run: |
          if [ -f Dockerfile ]; then echo "has_dockerfile=true" >> "$GITHUB_OUTPUT"; else
            echo "has_dockerfile=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Dockerfile ainda não existe (Issue #2). Build da imagem ignorado."
          fi
      - uses: docker/setup-buildx-action@v3
        if: steps.detect.outputs.has_dockerfile == 'true'
      - uses: docker/build-push-action@v6
        if: steps.detect.outputs.has_dockerfile == 'true'
        with:
          context: .
          push: false
          tags: sema-nexus-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
